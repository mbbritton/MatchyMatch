<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Arcade</title>
    <script>
      (function () {
        try {
          var THEMES = ['system', 'light', 'dark', 'midnight'];
          var stored = localStorage.getItem('puzzlr-theme');
          var theme = THEMES.indexOf(stored) !== -1 ? stored : null;
          if (theme === null) {
            var legacy = localStorage.getItem('puzzlr-dark-mode');
            theme = legacy === null ? 'system' : (legacy === 'true' ? 'dark' : 'light');
          }
          var resolved = theme === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : theme;
          document.documentElement.dataset.theme = resolved;
          if (resolved !== 'light') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
